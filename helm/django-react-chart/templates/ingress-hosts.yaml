apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-frontend
  namespace: app
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - nazananas.pp.ua
      secretName: nazananas-tls

  rules:
    - host: nazananas.pp.ua
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
